version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,srvr"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr,srvr"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/2181 && echo ruok >&3 && head -c 4 <&3 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter_notebook
    ports:
      - "8889:8888"
    volumes:
      - ../notebooks:/home/jovyan/work

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      #JUPYTER_TOKEN: ""
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --no-browser --ip=0.0.0.0
    depends_on:
      - kafka
      - mongo

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_BROKER_ID: "1"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    depends_on:
      mongo:
        condition: service_started
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://root:example@mongo:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: secret
    ports:
      - "8081:8081"
    restart: unless-stopped

  spark-app:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-app
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      MONGO_URL: "mongodb://root:example@mongo:27017/?authSource=admin"
      SPARK_PACKAGES: "${SPARK_PACKAGES}"
      TEAM_CONFIG_SPARK: "spark/team_config.yaml"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      bash -lc "
      python3 -m pip install -r spark/requirements.txt &&
      PYSPARK_SUBMIT_ARGS='--packages ${SPARK_PACKAGES} pyspark-shell' python3 -m spark.streaming_job
      "
    restart: unless-stopped

  producer-alex:
    build:
      context: .
      dockerfile: producer_alex/Dockerfile
    container_name: producer_alex
    env_file:
      - .env
    environment:
      BROWSER: "0"
      #S#POTIPY_CACHE: "/app/src/.cache-${USERNAME}"   # persisted in bind mount
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: ["python", "-u", "-m", "producer_alex.producer"]
    restart: unless-stopped

  producer-avd:
    build:
      context: .
      dockerfile: producer_avd/Dockerfile
    container_name: producer_avd
    env_file:
      - .env
    environment:
      BROWSER: "0"
      #S#POTIPY_CACHE: "/app/src/.cache-${USERNAME}"   # persisted in bind mount
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - "8888:8888"  # needed only when doing interactive auth outside Docker; safe to keep
    command: [ "python", "-u", "-m", "producer_avd.producer" ]
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: docker/consumer.Dockerfile
    container_name: consumer
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: ["python", "-u", "-m", "consumers.kafka_consumer"]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: streamlit-app
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    working_dir: /app
    restart: unless-stopped

volumes:
  mongo_data:

